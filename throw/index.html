<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>45°가 정말 가장 멀리 갈까?</title>
  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#d9dee7;
      --accent:#2563eb;
      --accent2:#f59e0b;
      --ball:#7c3aed;
      --benchmark:#9ca3af;
      --ground:#9aa3af;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    h1{font-size:clamp(24px,4vw,38px);margin:0 0 8px}
    .sub{color:var(--muted);margin-bottom:16px;line-height:1.55}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
    svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
    .status{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
    .status strong{font-size:16px}
    .status span{color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-top:14px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
    .control{margin-bottom:16px}
    .control label{display:flex;justify-content:space-between;gap:12px;font-weight:650;font-size:14px;margin-bottom:7px}
    input[type="range"]{width:100%}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:700;padding:9px 14px;cursor:pointer}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric{border:1px solid var(--line);border-radius:12px;padding:11px}
    .metric .k{font-size:12px;color:var(--muted)}
    .metric .v{font-size:21px;font-weight:800;margin-top:3px}
    .hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
    .best{margin-top:10px;padding:10px;border-radius:10px;background:#f3f4f6;text-align:center;font-size:14px}
    .footer-note{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.6}
  </style>
</head>
<body>
<main class="wrap">
  <h1>공은 정말 45°로 던져야 가장 멀리 갈까?</h1>

  <div class="sub">
    공기저항이 없고, 출발 높이와 착지 높이가 같은 이상적인 조건입니다.
    공을 잡아 왼쪽으로 당겼다가 놓아보세요.
  </div>

  <section class="card">
    <div class="status">
      <strong id="status">Ready</strong>
      <span id="live">45.0° · 25.0 m/s</span>
    </div>

    <svg id="field" viewBox="0 0 1000 520" aria-label="포물선 운동 인터랙티브 실험">
      <rect x="20" y="20" width="960" height="440" rx="14" fill="#fbfcfe" stroke="#edf0f4"/>
      <line x1="55" y1="415" x2="945" y2="415" stroke="#9aa3af" stroke-width="3"/>
      <g id="ticks"></g>

      <path id="benchmark" d="" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="4 7" opacity=".55"/>
      <path id="trajectory" d="" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="7 7"/>

      <line id="pullLine" x1="145" y1="395" x2="145" y2="395" stroke="#6b7280" stroke-width="3" stroke-dasharray="6 6" opacity="0"/>
      <line id="launchVector" x1="145" y1="395" x2="195" y2="345" stroke="#2563eb" stroke-width="5" stroke-linecap="round" opacity="0"/>
      <polygon id="arrow" points="195,345 180,350 188,361" fill="#2563eb" opacity="0"/>

      <circle id="ball" cx="145" cy="395" r="17" fill="#7c3aed" stroke="#111827" stroke-width="2" style="cursor:grab"/>
      <path id="seam"
            d="M130 390 Q145 378 160 390 M130 400 Q145 412 160 400 M145 379 L145 411"
            fill="none" stroke="#111827" stroke-width="1.3" opacity=".65" pointer-events="none"/>

      <text id="resultBig" x="500" y="95" text-anchor="middle" font-size="32" font-weight="800" fill="#111827"></text>
      <text x="62" y="445" font-size="12" fill="#6b7280">0 m</text>
    </svg>

    <div class="hint">
      당긴 거리 → 초기속도 · 위/아래 움직임 → 발사각 · 같은 속도에서 회색 점선은 45° 기준 궤적입니다.
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="control">
        <label for="angle">발사각 <output id="angleOut">45.0°</output></label>
        <input id="angle" type="range" min="10" max="80" step="0.5" value="45"/>
      </div>

      <div class="control">
        <label for="speed">초기속도 <output id="speedOut">25.0 m/s</output></label>
        <input id="speed" type="range" min="10" max="40" step="0.5" value="25"/>
      </div>

      <div class="buttons">
        <button id="throwBtn" class="primary" type="button">던지기</button>
        <button id="resetBtn" type="button">초기화</button>
      </div>
    </section>

    <section class="card">
      <div class="metrics">
        <div class="metric"><div class="k">이번 비거리</div><div class="v" id="rangeVal">63.7 m</div></div>
        <div class="metric"><div class="k">최고 높이</div><div class="v" id="peakVal">15.9 m</div></div>
        <div class="metric"><div class="k">45° 기준</div><div class="v" id="range45Val">63.7 m</div></div>
        <div class="metric"><div class="k">45° 대비</div><div class="v" id="deltaVal">0.0 m</div></div>
      </div>

      <button id="findBtn" type="button" style="width:100%;margin-top:10px">
        최적각 자동으로 찾기
      </button>

      <div id="bestText" class="best">
        같은 속도에서 45°를 이길 수 있을까요?
      </div>
    </section>
  </div>

  <div class="footer-note">
    현재 모델은 중력만 고려합니다. 공기저항과 바람은 다음 단계에서 추가할 예정입니다.
  </div>
</main>

<script>
(() => {
  const g = 9.81;

  const origin = { x:145, y:395 };
  const plot = { left:145, right:920, top:55, bottom:395 };

  const MIN_SPEED = 10;
  const MAX_SPEED = 40;
  const MAX_PULL_X = 110;
  const ANGLE_GAIN = 0.42;

  const field = document.getElementById('field');
  const ball = document.getElementById('ball');
  const seam = document.getElementById('seam');
  const trajectory = document.getElementById('trajectory');
  const benchmark = document.getElementById('benchmark');
  const pullLine = document.getElementById('pullLine');
  const launchVector = document.getElementById('launchVector');
  const arrow = document.getElementById('arrow');
  const ticks = document.getElementById('ticks');

  const status = document.getElementById('status');
  const live = document.getElementById('live');
  const resultBig = document.getElementById('resultBig');

  const angle = document.getElementById('angle');
  const speed = document.getElementById('speed');
  const angleOut = document.getElementById('angleOut');
  const speedOut = document.getElementById('speedOut');

  const rangeVal = document.getElementById('rangeVal');
  const peakVal = document.getElementById('peakVal');
  const range45Val = document.getElementById('range45Val');
  const deltaVal = document.getElementById('deltaVal');
  const bestText = document.getElementById('bestText');

  const throwBtn = document.getElementById('throwBtn');
  const resetBtn = document.getElementById('resetBtn');
  const findBtn = document.getElementById('findBtn');

  let dragging = false;
  let raf = null;
  let returnTimer = null;

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const rad = d => d*Math.PI/180;

  const rangeFor = (a,s) =>
    s*s*Math.sin(2*rad(a))/g;

  const flightFor = (a,s) =>
    2*s*Math.sin(rad(a))/g;

  const peakFor = (a,s) => {
    const vy = s*Math.sin(rad(a));
    return vy*vy/(2*g);
  };

  function params(){
    return {
      a:+angle.value,
      s:+speed.value
    };
  }

  function setBall(x,y){
    ball.setAttribute('cx',x);
    ball.setAttribute('cy',y);
    seam.setAttribute(
      'transform',
      `translate(${x-origin.x} ${y-origin.y})`
    );
  }

  function clearMotion(){
    if(raf) cancelAnimationFrame(raf);
    raf = null;

    if(returnTimer) clearTimeout(returnTimer);
    returnTimer = null;
  }

  function scaleFor(a,s){
    const maxR =
      Math.max(
        20,
        Math.max(
          rangeFor(a,s),
          rangeFor(45,s)
        )*1.12
      );

    const maxH =
      Math.max(
        8,
        Math.max(
          peakFor(a,s),
          peakFor(45,s)
        )*1.30
      );

    return {
      sx:(plot.right-plot.left)/maxR,
      sy:(plot.bottom-plot.top)/maxH,
      maxR,
      maxH
    };
  }

  function screenPoint(t,a,s,sc){
    const th = rad(a);

    const x =
      s*Math.cos(th)*t;

    const y =
      s*Math.sin(th)*t
      -0.5*g*t*t;

    return {
      x:origin.x + x*sc.sx,
      y:origin.y - y*sc.sy
    };
  }

  function pathFor(a,s,sc){
    const tf = flightFor(a,s);
    const n = 100;
    let d = '';

    for(let i=0;i<=n;i++){
      const p =
        screenPoint(
          tf*i/n,
          a,
          s,
          sc
        );

      d +=
        (i ? ' L ' : 'M ')
        + p.x.toFixed(1)
        + ' '
        + p.y.toFixed(1);
    }

    return d;
  }

  function drawTicks(sc){
    ticks.innerHTML = '';

    const count = 5;
    const ns =
      'http://www.w3.org/2000/svg';

    for(let i=1;i<=count;i++){
      const x =
        plot.left
        +(plot.right-plot.left)
        *i/count;

      const val =
        sc.maxR*i/count;

      const line =
        document.createElementNS(
          ns,
          'line'
        );

      line.setAttribute('x1',x);
      line.setAttribute('y1',415);
      line.setAttribute('x2',x);
      line.setAttribute('y2',423);
      line.setAttribute(
        'stroke',
        '#9ca3af'
      );

      const text =
        document.createElementNS(
          ns,
          'text'
        );

      text.setAttribute('x',x);
      text.setAttribute('y',445);
      text.setAttribute(
        'text-anchor',
        'middle'
      );
      text.setAttribute(
        'font-size',
        '12'
      );
      text.setAttribute(
        'fill',
        '#6b7280'
      );

      text.textContent =
        val.toFixed(0)+' m';

      ticks.append(
        line,
        text
      );
    }
  }

  function updatePreview(){
    const {a,s} = params();

    const r =
      rangeFor(a,s);

    const h =
      peakFor(a,s);

    const r45 =
      rangeFor(45,s);

    const delta =
      r-r45;

    const sc =
      scaleFor(a,s);

    angleOut.textContent =
      a.toFixed(1)+'°';

    speedOut.textContent =
      s.toFixed(1)+' m/s';

    live.textContent =
      a.toFixed(1)
      +'° · '
      +s.toFixed(1)
      +' m/s';

    rangeVal.textContent =
      r.toFixed(1)+' m';

    peakVal.textContent =
      h.toFixed(1)+' m';

    range45Val.textContent =
      r45.toFixed(1)+' m';

    deltaVal.textContent =
      (delta>=0?'+':'')
      +delta.toFixed(1)
      +' m';

    trajectory.setAttribute(
      'd',
      pathFor(a,s,sc)
    );

    benchmark.setAttribute(
      'd',
      pathFor(45,s,sc)
    );

    drawTicks(sc);
  }

  function hideAim(){
    pullLine.setAttribute(
      'opacity',
      '0'
    );

    launchVector.setAttribute(
      'opacity',
      '0'
    );

    arrow.setAttribute(
      'opacity',
      '0'
    );
  }

  function home(message='Ready'){
    setBall(
      origin.x,
      origin.y
    );

    hideAim();

    status.textContent =
      message;
  }

  function drawLaunchVector(a,s){
    const th =
      rad(a);

    const len =
      55
      +60*
      (s-MIN_SPEED)
      /(MAX_SPEED-MIN_SPEED);

    const x2 =
      origin.x
      +len*Math.cos(th);

    const y2 =
      origin.y
      -len*Math.sin(th);

    launchVector.setAttribute(
      'x1',
      origin.x
    );

    launchVector.setAttribute(
      'y1',
      origin.y
    );

    launchVector.setAttribute(
      'x2',
      x2
    );

    launchVector.setAttribute(
      'y2',
      y2
    );

    launchVector.setAttribute(
      'opacity',
      '1'
    );

    const ux =
      Math.cos(th);

    const uy =
      -Math.sin(th);

    const px =
      -uy;

    const py =
      ux;

    const bx =
      x2-17*ux;

    const by =
      y2-17*uy;

    arrow.setAttribute(
      'points',
      `${x2},${y2}
       ${bx+8*px},${by+8*py}
       ${bx-8*px},${by-8*py}`
    );

    arrow.setAttribute(
      'opacity',
      '1'
    );
  }

  function animateThrow(){
    clearMotion();

    hideAim();

    resultBig.textContent = '';

    const {a,s} =
      params();

    const sc =
      scaleFor(a,s);

    const tf =
      flightFor(a,s);

    const startTime =
      performance.now();

    const playback =
      0.72;

    status.textContent =
      'Flying…';

    function frame(now){
      const u =
        clamp(
          (now-startTime)
          /(playback*1000),
          0,
          1
        );

      const p =
        screenPoint(
          tf*u,
          a,
          s,
          sc
        );

      setBall(
        p.x,
        p.y
      );

      if(u>=1){
        raf = null;

        const r =
          rangeFor(a,s);

        resultBig.textContent =
          r.toFixed(1)
          +' m';

        status.textContent =
          'Landed';

        returnTimer =
          setTimeout(
            ()=>{
              home('Ready');
              resultBig.textContent = '';
            },
            550
          );

        return;
      }

      raf =
        requestAnimationFrame(
          frame
        );
    }

    raf =
      requestAnimationFrame(
        frame
      );
  }

  function svgPoint(evt){
    const p =
      field.createSVGPoint();

    p.x =
      evt.clientX;

    p.y =
      evt.clientY;

    const ctm =
      field.getScreenCTM();

    return ctm
      ? p.matrixTransform(
          ctm.inverse()
        )
      : origin;
  }

  function mapDrag(p){
    const dx =
      clamp(
        origin.x-p.x,
        0,
        MAX_PULL_X
      );

    const dy =
      clamp(
        p.y-origin.y,
        -85,
        85
      );

    const power =
      Math.pow(
        dx/MAX_PULL_X,
        0.48
      );

    const s =
      MIN_SPEED
      +power*
      (MAX_SPEED-MIN_SPEED);

    const a =
      clamp(
        45
        +dy*ANGLE_GAIN,
        10,
        80
      );

    angle.value =
      a.toFixed(1);

    speed.value =
      s.toFixed(1);

    const shownX =
      origin.x-dx;

    const shownY =
      origin.y+dy;

    setBall(
      shownX,
      shownY
    );

    pullLine.setAttribute(
      'x1',
      shownX
    );

    pullLine.setAttribute(
      'y1',
      shownY
    );

    pullLine.setAttribute(
      'x2',
      origin.x
    );

    pullLine.setAttribute(
      'y2',
      origin.y
    );

    pullLine.setAttribute(
      'opacity',
      '1'
    );

    drawLaunchVector(
      a,
      s
    );

    updatePreview();

    status.textContent =
      'Aim…';
  }

  ball.addEventListener(
    'pointerdown',
    e=>{
      dragging = true;

      clearMotion();

      ball.setPointerCapture(
        e.pointerId
      );

      ball.style.cursor =
        'grabbing';

      resultBig.textContent = '';
    }
  );

  ball.addEventListener(
    'pointermove',
    e=>{
      if(dragging)
        mapDrag(
          svgPoint(e)
        );
    }
  );

  function release(){
    if(!dragging)
      return;

    dragging = false;

    ball.style.cursor =
      'grab';

    setBall(
      origin.x,
      origin.y
    );

    animateThrow();
  }

  ball.addEventListener(
    'pointerup',
    release
  );

  ball.addEventListener(
    'pointercancel',
    release
  );

  angle.addEventListener(
    'input',
    ()=>{
      bestText.textContent =
        '같은 속도에서 45°를 이길 수 있을까요?';

      updatePreview();
    }
  );

  speed.addEventListener(
    'input',
    ()=>{
      bestText.textContent =
        '같은 속도에서 45°를 이길 수 있을까요?';

      updatePreview();
    }
  );

  throwBtn.addEventListener(
    'click',
    animateThrow
  );

  resetBtn.addEventListener(
    'click',
    ()=>{
      clearMotion();

      angle.value = '45';
      speed.value = '25';

      bestText.textContent =
        '같은 속도에서 45°를 이길 수 있을까요?';

      resultBig.textContent = '';

      updatePreview();

      home();
    }
  );

  findBtn.addEventListener(
    'click',
    ()=>{
      const s =
        +speed.value;

      let bestA = 10;
      let bestR = -1;

      for(
        let a=10;
        a<=80;
        a+=0.1
      ){
        const r =
          rangeFor(a,s);

        if(r>bestR){
          bestR = r;
          bestA = a;
        }
      }

      angle.value =
        bestA.toFixed(1);

      updatePreview();

      bestText.innerHTML =
        '<strong>Best angle = '
        +bestA.toFixed(1)
        +'°</strong> · Range = '
        +bestR.toFixed(1)
        +' m';

      status.textContent =
        'Best angle found';
    }
  );

  updatePreview();
  home();
})();
</script>
</body>
</html>
